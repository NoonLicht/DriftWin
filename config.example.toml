# Пример конфигурации DriftWin. Положите как %APPDATA%\DriftWin\config.toml или укажите --config.
# Проверка без запуска: driftwin --check-config [--config путь]. Изменения подхватываются на лету.

mod_key = "super"            # super | alt  (ctrl не поддерживается)

[windows]
only = []                    # белый список exe; вместо --only (безопасный режим требует список или --all)
exclude = [ { exe = "Taskmgr.exe" }, { class = "Shell_TrayWnd" } ]
max_fps = 0                  # 0 — по частоте обновления мониторов; иначе 10..240
panic_key = "mod+ctrl+shift+r"

[navigation]
pan_step = 100.0             # шаг клавиш-стрелок, px
camera_speed = 0.3           # доля пути, проходимая камерой за кадр (0.01..1)
mouse_speed = 1.0            # множитель перетаскивания холста мышью
auto_navigate = true         # при смене фокуса на окно вне экрана камера подходит к нему

nudge_step = 20              # nudge-window, px
resize_step = 20             # grow-window / shrink-window, px

[navigation.edge_pan]
zone = 100                   # ширина зоны у края при перетаскивании окна
speed_min = 4                # px за кадр (при 60 fps) на границе зоны
speed_max = 10               # и у самого края
cursor_pan = false           # крутить вид и просто курсором у края (toggle-cursor-pan)
cursor_zone = 20
latency_ms = 120

[navigation.bookmarks]
"1" = [0, 0]

[snap]
enabled = true
gap = 12                     # зазор между привязанными окнами
gap_step = 4                # шаг изменения зазора на лету: Win+] больше, Win+[ меньше (snap-gap-increase/-decrease)
outer_gap = 12              # отступ от края вида при fill-window
distance = 24                # на каком расстоянии срабатывает притяжка
break_force = 32             # насколько надо дёрнуть, чтобы отлипнуть
corners = true               # выравнивать края соседних окон
centers = false              # выравнивать центры

# На каких мониторах работает DriftWin. Имена: driftwin --list-monitors (DISPLAY1, ...), "primary" или номер.
# Пусто — только основной. Выбранные мониторы образуют один общий холст.
[monitors]
use = []                     # например ["DISPLAY2", "DISPLAY3"]
isolate = true               # окна не заходят на остальные мониторы (прячутся, пока перекрывают их)

[zoom]
fit_padding = 80             # отступ при fit-window
min = 0.1                    # нижняя граница обзора; верхняя всегда 1.0
step = 1.25                  # шаг zoom-in / zoom-out / колеса в обзоре

# Фон холста: виден в обзоре (и под окнами, если on_desktop = true)
[background]
type = "default"             # default | grid | solid | tile | wallpaper | none
color = "#181a20"
grid_color = "#303440"
grid_size = 100              # шаг сетки в мире, px
# image = "C:/Pictures/tile.png"   # для tile и wallpaper; пусто — обои рабочего стола
on_desktop = false           # эксперимент: рисовать фон и под окнами (скрывает значки рабочего стола)

# Горячие углы основного монитора: любое действие. Выключено, пока углы не заданы.
[hot_corners]
threshold = 4
# top_left = "home-toggle"
# top_right = "focus-center"

[bindings]
disable_defaults = []        # "keys", "mouse" — отключить стандартные привязки

[keybindings]
# "комбинация" = "действие"; "none" отключает стандартную привязку
"mod+ctrl+right" = "pan-viewport right"
"mod+ctrl+q" = "quit"
"mod+ctrl+h" = "none"
# "mod+alt+shift+right" = "nudge-window right"

[mouse.anywhere]
"mod+ctrl+left" = "pan-viewport"          # перетаскивание холста
# "alt+left" = "move-window"               # стандартно; Alt+Shift+ЛКМ — вместе с кластером
# "alt+right" = "resize-window-snapped"    # стандартно; Alt+Shift+ПКМ — только это окно
# "alt+middle" = "fit-window-snapped"      # стандартно; Alt+Shift+СКМ — fit-window; mod+СКМ — fill-window

[[window_rules]]
app_id = "notepad.exe"       # exe без учёта регистра; можно class = "...", title = "*glob*" или "/regex/"
size = [900, 600]            # видимый кадр
# widget = true              # остаётся на холсте, вне навигации/MRU
# pinned_to_screen = true    # закреплено на экране (position — от центра монитора, Y вверх)
# position = [0, 0]
