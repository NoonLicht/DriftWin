[package]
name = "dw-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dw-core.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
tracing.workspace = true

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
]
