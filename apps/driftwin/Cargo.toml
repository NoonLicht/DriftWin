[package]
name = "driftwin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dw-core.workspace = true
dw-win.workspace = true
dw-input.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
tray-icon = { version = "0.26", default-features = false }

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Security",
]
